name: Upload

on:
  push:
    branches:
      - main
      - prepare/sapium-formal031
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: Install formal dependencies
      run: caps --strict --ci && yarn install --immutable && caps verify --toolchain

    - name: Check canonical snapshot and types
      run: |
        set -euo pipefail
        node acceptance/prepare.mjs
        calcit calcit.cirru edit format
        test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
        calcit calcit.cirru --check-only --all-defs --strict-types
        calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status == "passed" and .diagnostics == [] then true else ., false end'

    - name: Compile and build frontend
      run: calcit calcit.cirru js && yarn vite build --base="https://cos-sh.tiye.me/${GITHUB_REPOSITORY}/"

    - name: Check current production revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: production
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
        fi

    - name: Upload and verify frontend assets
      if: steps.production.outputs.current == 'true'
      timeout-minutes: 10
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist/assets
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ github.repository }}/assets/
        public-base-url: https://cos-sh.tiye.me/${{ github.repository }}/assets/
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Recheck main before publishing the page
      if: steps.production.outputs.current == 'true'
      id: page-revision
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Skip stale page revision ${GITHUB_SHA}; current main is ${current_sha}."
        fi

    - name: Deploy to server
      if: steps.page-revision.outputs.current == 'true'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: steps.page-revision.outputs.current == 'true'
      run: echo "${{ steps.deploy.outputs.status }}"

    - name: Preserve official prepared source and frontend
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sapium-prepared
        path: |
          calcit.cirru
          acceptance/
          js-out/
          dist/
        retention-days: 7
